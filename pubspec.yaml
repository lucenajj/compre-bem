name: compre_bem
description: Compre Bem - app de mercado com leitor de código de barras, comparador mensal e dashboard.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  mobile_scanner: ^7.4.2
  fl_chart: ^1.2.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  image_picker: ^1.1.2
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
